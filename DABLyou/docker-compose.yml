services:
  postgres:
    image: postgres:16
    container_name: taba3_postgres
    environment:
      POSTGRES_USER: taba3
      POSTGRES_PASSWORD: taba3
      POSTGRES_DB: taba3_w_erba7
    ports:
      - "5432:5432"
    volumes:
      - taba3_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: taba3_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - taba3_redis_data:/data

volumes:
  taba3_pg_data:
  taba3_redis_data:
